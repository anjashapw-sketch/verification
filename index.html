<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Device Verification - TG MANDI</title>

<!-- Real Telegram WebApp SDK (do NOT stub it, otherwise detection is always "telegram") -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0b1220;
        --text: #f0f4f8;
        --hint: #8aa7c2;
        --primary: #00d4aa;
        --secondary: #63b3e8;
        --card: rgba(17, 23, 35, 0.8);
        --border: rgba(255, 255, 255, 0.08);
        --success: #2ecc71;
        --error: #e74c3c;
        --warning: #f1c40f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        overflow-x: hidden;
    }
    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }

    .env-badge {
        position: fixed; top: 16px; left: 16px;
        padding: 8px 16px; background: var(--error); color: #fff;
        border-radius: 20px; font-size: 13px; z-index: 9999; display: none;
    }

    .bg-layer {
        position: fixed; width: 400px; height: 400px; border-radius: 50%;
        filter: blur(80px); pointer-events: none; z-index: 0; opacity: .5;
        animation: float 20s ease-in-out infinite;
    }
    .layer-1 { top: -100px; left: -100px; background: radial-gradient(circle, #00d4aa 0%, #008866 100%); }
    .layer-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, #63b3e8 0%, #2c9ab7 100%); animation-delay: 7s; }
    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -30px) scale(1.05); }
        66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .app-container {
        position: relative; z-index: 10; padding: 24px;
        width: 100%; max-width: 440px;
    }
    .card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 24px; padding: 40px 32px; position: relative;
        backdrop-filter: blur(20px);
        animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header { text-align: center; margin-bottom: 28px; }
    .shield-icon {
        width: 56px; height: 56px; margin: 0 auto 16px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 16px; display: flex; align-items: center; justify-content: center;
    }
    .shield-icon svg { width: 36px; height: 36px; }
    .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .header p { color: var(--hint); font-size: 13px; }

    .steps-indicator { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--hint); }
    .step-number {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid var(--border); font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        transition: all .2s ease;
    }
    .step-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .step.active .step-number { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(0,212,170,.3); }
    .step.completed .step-number { background: var(--primary); border-color: var(--primary); color: #0b1220; }

    .progress-bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill {
        height: 100%; width: 0%; border-radius: 3px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        transition: width .4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-display {
        padding: 16px; border-radius: 12px; margin: 16px 0; text-align: center;
        font-size: 14px; font-weight: 500; min-height: 20px; transition: all .3s ease;
    }
    .status-ok { background: rgba(46,204,113,.1); border: 1px solid var(--success); color: var(--success); }
    .status-error { background: rgba(231,76,60,.1); border: 1px solid var(--error); color: var(--error); }
    .status-pending { background: rgba(241,196,15,.1); border: 1px solid var(--warning); color: var(--warning); }

    .dots { display: inline-flex; gap: 6px; align-items: center; margin-right: 8px; vertical-align: middle; }
    .dot-animation {
        width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
        animation: dotBounce 1.4s ease-in-out infinite;
    }
    .dot-animation:nth-child(2) { animation-delay: .2s; }
    .dot-animation:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }

    .btn {
        width: 100%; padding: 14px 24px; border: none; border-radius: 12px;
        font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600;
        cursor: pointer; margin-top: 12px; transition: all .2s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #0b1220; }
    .btn-primary:hover { box-shadow: 0 4px 20px rgba(0,212,170,.4); }

    .note { margin-top: 20px; text-align: center; font-size: 12px; color: var(--hint); line-height: 1.5; }

    @media (max-width: 440px) {
        .card { padding: 32px 20px; }
        .header h1 { font-size: 20px; }
    }
</style>
</head>
<body>
    <div class="env-badge" id="env-badge"></div>
    <div class="bg-layer layer-1"></div>
    <div class="bg-layer layer-2"></div>

    <div class="app-container">
        <div class="card" id="card">
            <div class="header">
                <div class="shield-icon">
                    <svg viewBox="0 0 64 64" fill="none">
                        <path d="M32 4 8 13v17c0 14 10 25 24 30 14-5 24-16 24-30V13L32 4Z" stroke="#0b1220" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M22 32l8 8 14-16" stroke="#0b1220" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>Device Verification</h1>
                <p>Verifying your device for secure account access</p>
            </div>

            <div class="steps-indicator">
                <div class="step active" id="s0"><span class="step-number">1</span><span class="step-label">Session</span></div>
                <div class="step" id="s1"><span class="step-number">2</span><span class="step-label">Device</span></div>
                <div class="step" id="s2"><span class="step-number">3</span><span class="step-label">Result</span></div>
            </div>

            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

            <div class="status-display status-pending" id="status">Starting verification...</div>

            <button class="btn btn-primary" id="retry" style="display:none;">Try Again</button>

            <p class="note" id="note">No personal data is collected. Only device characteristics are read and hashed on the server.</p>
        </div>
    </div>

<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    const tg = window.Telegram && window.Telegram.WebApp;
    const qs = new URLSearchParams(location.search);
    const userId = qs.get('u');
    const token = qs.get('t');
    const sign = qs.get('s');

    // Real Telegram check: SDK loaded AND running inside the Telegram client
    // (platform is 'unknown' in a normal browser). Keyboard-button WebApps have
    // empty initData, so don't rely on initData alone.
    const isTelegram = !!(tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')));

    const badge = $('env-badge');
    const steps = [$('s0'), $('s1'), $('s2')];
    const progressFill = $('progress');
    const statusDisplay = $('status');
    const retryBtn = $('retry');

    if (!isTelegram) {
        badge.textContent = '📱 Direct Access';
        badge.style.display = 'block';
        ['.steps-indicator', '.progress-bar', '#status', '#retry'].forEach(sel => {
            const el = document.querySelector(sel);
            if (el) el.style.display = 'none';
        });
        $('note').textContent = 'This page must be opened from the Telegram bot. Please go back to the bot and tap "Verify My Device".';
        return;
    }

    try { tg.ready(); tg.expand(); } catch (e) {}

    // ---------- helpers ----------
    function progressTo(p) { progressFill.style.width = p + '%'; }

    function markStep(idx) {
        steps.forEach((s, i) => {
            s.classList.remove('active', 'completed');
            if (i < idx) s.classList.add('completed');
            if (i === idx) s.classList.add('active');
        });
    }

    function showStatus(msg, type) {
        statusDisplay.className = 'status-display ' + (type || 'status-pending');
        statusDisplay.textContent = msg;
    }

    function fail(msg) {
        showStatus(msg, 'status-error');
        retryBtn.style.display = 'block';
    }

    const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    async function sha256(str) {
        try {
            return toHex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
        } catch (e) {
            return 'na';
        }
    }

    // ---------- collectors ----------
    async function getCanvasHash() {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 260; canvas.height = 70;
            const c = canvas.getContext('2d');
            c.textBaseline = 'top';
            c.fillStyle = '#f60'; c.fillRect(110, 1, 70, 22);
            c.fillStyle = '#069';
            c.fillText('TG MANDI ✅ Cwm fjordbank glyphs vext quiz', 2, 15);
            c.globalCompositeOperation = 'multiply';
            [['#f0f', 40, 50], ['#0ff', 70, 50], ['#ff0', 55, 30]].forEach(([col, x, y]) => {
                c.fillStyle = col; c.beginPath(); c.arc(x + 150, y, 22, 0, 6.28); c.fill();
            });
            return canvas.toDataURL().slice(41, 73);
        } catch (e) { return 'na'; }
    }

    function getWebgl() {
        const out = { v: 'na', r: 'na', p: 'na' };
        try {
            const gl = document.createElement('canvas').getContext('webgl') ||
                       document.createElement('canvas').getContext('experimental-webgl');
            if (!gl) return out;
            const ext = gl.getExtension('WEBGL_debug_renderer_info');
            out.v = String(gl.getParameter(ext ? ext.UNMASKED_VENDOR_WEBGL : gl.VENDOR)).slice(0, 80);
            out.r = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)).slice(0, 100);
            out.p = [
                gl.MAX_TEXTURE_SIZE, gl.MAX_VERTEX_ATTRIBS, gl.MAX_VIEWPORT_DIMS,
                gl.MAX_RENDERBUFFER_SIZE, gl.MAX_VARYING_VECTORS,
                gl.MAX_VERTEX_UNIFORM_VECTORS, gl.MAX_FRAGMENT_UNIFORM_VECTORS
            ].map(k => String(gl.getParameter(k))).join('|');
        } catch (e) {}
        return out;
    }

    async function getAudioHash() {
        try {
            const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!OAC) return 'na';
            const actx = new OAC(1, 44100, 44100);
            const osc = actx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.value = 10000;
            const comp = actx.createDynamicsCompressor();
            comp.threshold.value = -50;
            comp.knee.value = 40;
            comp.ratio.value = 12;
            comp.attack.value = 0;
            comp.release.value = 0.25;
            osc.connect(comp);
            comp.connect(actx.destination);
            osc.start(0);
            const buf = await actx.startRendering();
            const data = buf.getChannelData(0);
            let sum = 0;
            for (let i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
            return sum.toFixed(6);
        } catch (e) { return 'na'; }
    }

    function getFonts() {
        try {
            const base = ['monospace', 'sans-serif', 'serif'];
            const list = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Roboto',
                'Helvetica', 'Tahoma', 'Trebuchet MS', 'Impact', 'Comic Sans MS', 'Palatino',
                'Garamond', 'Segoe UI', 'Noto Sans', 'Droid Sans', 'Ubuntu', 'SF Pro Text',
                'Menlo', 'Consolas', 'Calibri', 'Cambria', 'Futura', 'Gill Sans'];
            const text = 'mmmmmmmmmmlli';
            const x = document.createElement('canvas').getContext('2d');
            const w = {};
            base.forEach(b => { x.font = '72px ' + b; w[b] = x.measureText(text).width; });
            return list.map(f => base.some(b => {
                x.font = "72px '" + f + "'," + b;
                return x.measureText(text).width !== w[b];
            })).join('');
        } catch (e) { return 'na'; }
    }

    // Persistent device id: cookie -> IndexedDB -> new random
    function idbGet() {
        return new Promise(resolve => {
            try {
                const req = indexedDB.open('tgm', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('k');
                req.onerror = () => resolve(null);
                req.onsuccess = () => {
                    try {
                        const g = req.result.transaction('k', 'readonly').objectStore('k').get('tgm_did');
                        g.onsuccess = () => resolve(g.result || null);
                        g.onerror = () => resolve(null);
                    } catch (e) { resolve(null); }
                };
            } catch (e) { resolve(null); }
        });
    }
    function idbSet(val) {
        return new Promise(resolve => {
            try {
                const req = indexedDB.open('tgm', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('k');
                req.onerror = () => resolve();
                req.onsuccess = () => {
                    try {
                        const tx = req.result.transaction('k', 'readwrite');
                        tx.objectStore('k').put(val, 'tgm_did');
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => resolve();
                    } catch (e) { resolve(); }
                };
            } catch (e) { resolve(); }
        });
    }
    async function getDeviceId() {
        const re = /^[0-9a-f]{32}$/;
        const m = document.cookie.match(/(?:^|; )tgm_did=([0-9a-f]{32})/);
        let id = m && re.test(m[1]) ? m[1] : null;
        if (!id) {
            const stored = await idbGet();
            if (stored && re.test(stored)) id = stored;
        }
        if (!id) {
            id = toHex(crypto.getRandomValues(new Uint8Array(16)));
        }
        await idbSet(id);
        try {
            document.cookie = 'tgm_did=' + id + '; max-age=315360000; path=/; SameSite=None; Secure';
        } catch (e) {}
        return id;
    }

    // ---------- main flow ----------
    async function run() {
        retryBtn.style.display = 'none';
        markStep(0);
        progressTo(20);
        showStatus('Checking your session...', 'status-pending');

        // User id: prefer Telegram's own data, fall back to the signed link param
        const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
        const uid = (tgUser && tgUser.id) ? String(tgUser.id) : userId;

        if (!uid || !token || !sign) {
            return fail('Invalid or expired link. Please open this page from the bot.');
        }
        if (userId && tgUser && String(tgUser.id) !== String(userId)) {
            return fail('This link was not issued for your account.');
        }

        markStep(1);
        progressTo(40);
        showStatus('Reading device characteristics...', 'status-pending');

        const [cv, au, webgl, did] = await Promise.all([
            getCanvasHash(), getAudioHash(), Promise.resolve(getWebgl()), getDeviceId()
        ]);
        const fn = getFonts();

        markStep(2);
        progressTo(80);
        statusDisplay.className = 'status-display status-pending';
        statusDisplay.innerHTML = '<span class="dots"><span class="dot-animation"></span><span class="dot-animation"></span><span class="dot-animation"></span></span>Sending verification to bot...';

        try {
            tg.sendData(JSON.stringify({
                v: 2,
                u: uid,
                t: token,
                s: sign,
                d: did,
                c: { cv: cv, au: au, fn: fn }
            }));

            steps[2].classList.remove('active');
            steps[2].classList.add('completed');
            progressTo(100);
            showStatus('Verified! You can close this page.', 'status-ok');
            // sendData normally closes the WebApp itself; this is a fallback
            setTimeout(() => { try { tg.close(); } catch (e) {} }, 2500);
        } catch (err) {
            progressTo(60);
            fail('Error sending data. Please try again.');
        }
    }

    retryBtn.addEventListener('click', run);
    run();
})();
</script>
</body>
</html>
