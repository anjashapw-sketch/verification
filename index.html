<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#070b16;
    --tx:#f2f6ff;
    --hint:#8fa3c0;
    --a1:#00e0b8;      /* mint */
    --a2:#4da3ff;      /* sky */
    --a3:#8b5cf6;      /* violet */
    --ok:#2ee59d;
    --bad:#ff5c6c;
    --glass:rgba(16,24,44,.62);
    --line:rgba(255,255,255,.09);
    --ring-len:276.46;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--tx);
    font:15px/1.45 'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));
    overflow-x:hidden;position:relative;
  }

  /* ---------- animated background ---------- */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
  .b1{width:380px;height:380px;top:-120px;left:-110px;background:radial-gradient(circle,var(--a1),transparent 70%);animation:drift1 18s ease-in-out infinite}
  .b2{width:420px;height:420px;bottom:-150px;right:-130px;background:radial-gradient(circle,var(--a2),transparent 70%);animation:drift2 22s ease-in-out infinite}
  .b3{width:300px;height:300px;top:38%;left:55%;background:radial-gradient(circle,var(--a3),transparent 70%);opacity:.35;animation:drift3 26s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,50px) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-40px) scale(1.1)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,60px) scale(1.2)}}
  .grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
            mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
    animation:gridMove 12s linear infinite;
  }
  @keyframes gridMove{to{background-position:44px 44px}}

  /* ---------- card ---------- */
  .wrap{position:relative;z-index:2;width:100%;max-width:420px}
  .card{
    position:relative;border-radius:26px;padding:30px 22px 24px;text-align:center;
    background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
    animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;
  }
  .card::before{ /* animated gradient border */
    content:'';position:absolute;inset:-1px;border-radius:27px;padding:1px;z-index:-1;
    background:conic-gradient(from var(--ang,0deg),transparent 0 60%,var(--a1),var(--a2),var(--a3),transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:.8;animation:spinBorder 6s linear infinite;
  }
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes spinBorder{to{--ang:360deg}}
  @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
  .card.bad{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

  /* ---------- shield + ring ---------- */
  .hero{position:relative;width:116px;height:116px;margin:0 auto 30px}
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
  .ring .track{stroke:rgba(255,255,255,.08)}
  .ring .fill{
    stroke:url(#g);stroke-dasharray:var(--ring-len);stroke-dashoffset:var(--ring-len);
    transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1);
    filter:drop-shadow(0 0 6px rgba(0,224,184,.55));
  }
  .halo{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(0,224,184,.25);animation:halo 2.4s ease-out infinite}
  .halo.h2{animation-delay:1.2s}
  @keyframes halo{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .shield{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}
  .shield .body{fill:rgba(0,224,184,.14);stroke:var(--a1);stroke-width:3;stroke-linejoin:round;transition:all .4s}
  .shield .tick{stroke:var(--a1);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;
    stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .6s .1s ease,stroke .4s}
  .scan{ /* scanning line across shield while running */
    position:absolute;left:50%;top:50%;width:46px;height:2px;margin-left:-23px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--a1),transparent);box-shadow:0 0 10px var(--a1);
    animation:scan 1.8s ease-in-out infinite;
  }
  @keyframes scan{0%,100%{transform:translateY(-20px);opacity:0}15%,85%{opacity:1}50%{transform:translateY(20px)}}
  .pct{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font:700 11px 'Space Grotesk',monospace;color:var(--hint);letter-spacing:.08em}

  h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;
     background:linear-gradient(90deg,#fff,#b9d4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{color:var(--hint);font-size:13.5px;margin:0 6px 18px}

  /* ---------- steps ---------- */
  ul{list-style:none;text-align:left;margin:0 0 14px;padding:6px 10px;border-radius:16px;
     background:rgba(255,255,255,.03);border:1px solid var(--line)}
  li{display:flex;align-items:center;gap:11px;padding:8px 2px;color:var(--hint);font-size:13.5px;
     opacity:0;transform:translateX(-10px);animation:stepIn .5s cubic-bezier(.16,1,.3,1) forwards;
     transition:color .3s}
  li:not(:last-child){border-bottom:1px dashed rgba(255,255,255,.06)}
  @keyframes stepIn{to{opacity:1;transform:none}}
  li .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(143,163,192,.5);flex:none;
          display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .3s}
  li.run{color:var(--tx)}
  li.run .dot{border-color:var(--a2);border-top-color:transparent;animation:spin .75s linear infinite;box-shadow:0 0 12px rgba(77,163,255,.45)}
  li.done{color:var(--tx)}
  li.done .dot{background:linear-gradient(135deg,var(--a1),var(--ok));border-color:transparent;color:#05221b;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  li.err{color:var(--bad)}
  li.err .dot{background:var(--bad);border-color:var(--bad);color:#fff;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}

  /* ---------- bar + status ---------- */
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px;position:relative}
  .bar i{display:block;height:100%;width:0;border-radius:6px;
         background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));background-size:200% 100%;
         transition:width .5s cubic-bezier(.16,1,.3,1);animation:flow 2s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  #status{font-size:13.5px;min-height:20px;color:var(--hint);transition:color .3s}
  #status.err{color:var(--bad)} #status.ok{color:var(--ok)}

  button{
    margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--a1),var(--a2));color:#04141f;font-family:inherit;font-weight:700;font-size:15px;display:none;
    box-shadow:0 8px 24px rgba(0,224,184,.28);transition:transform .15s,box-shadow .2s;
  }
  button:active{transform:scale(.97)}
  button.show{display:block;animation:cardIn .4s both}
  .note{margin-top:16px;font-size:11.5px;color:var(--hint);opacity:.85}

  /* ---------- success state ---------- */
  .card.success .shield .body{fill:rgba(46,229,157,.2);stroke:var(--ok)}
  .card.success .shield .tick{stroke:var(--ok);stroke-dashoffset:0}
  .card.success .scan{display:none}
  .card.success .ring .fill{stroke:var(--ok);filter:drop-shadow(0 0 8px rgba(46,229,157,.7))}
  .card.success .halo{border-color:rgba(46,229,157,.35)}
  .card.fail .shield .body{fill:rgba(255,92,108,.15);stroke:var(--bad)}
  .card.fail .scan,.card.fail .halo{display:none}
  .card.fail .ring .fill{stroke:var(--bad);filter:none}

  .spark{position:absolute;left:50%;top:58px;width:7px;height:7px;border-radius:50%;pointer-events:none;
         animation:burst .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes burst{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grid"></div>

<div class="wrap">
  <div class="card" id="card">
    <div class="hero">
      <div class="halo"></div><div class="halo h2"></div>
      <svg class="ring" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00e0b8"/><stop offset="1" stop-color="#4da3ff"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="44"/>
        <circle class="fill" id="ring" cx="50" cy="50" r="44"/>
      </svg>
      <svg class="shield" viewBox="0 0 64 64">
        <path class="body" d="M32 4 8 13v17c0 14 10 25 24 30 14-5 24-16 24-30V13L32 4Z"/>
        <path class="tick" d="m22 32 7 7 13-14"/>
      </svg>
      <div class="scan"></div>
      <div class="pct" id="pct">0%</div>
    </div>

    <h1>Verifying your device</h1>
    <p class="sub">This keeps the store free of fake accounts and duplicate referrals.</p>

    <ul id="steps"></ul>
    <div class="bar"><i id="bar"></i></div>
    <div id="status">Starting...</div>
    <button id="retry">Try again</button>
    <p class="note">🔒 No personal data is collected. Only device characteristics are read and hashed on the server.</p>
  </div>
</div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  const qs = new URLSearchParams(location.search);
  const U = qs.get('u'), T = qs.get('t'), S = qs.get('s');
  const $ = id => document.getElementById(id);
  const card = $('card');

  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor('#070b16');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#070b16');
    } catch(e){}
  }

  const STEPS = ['Checking your session','Reading screen & system','Reading graphics','Reading audio engine',
                 'Reading fonts','Securing device ID','Sending result'];
  const ul = $('steps');
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li'); li.id='s'+i;
    li.style.animationDelay=(0.25+i*0.07)+'s';
    li.innerHTML='<span class="dot"></span><span>'+s+'</span>';
    ul.appendChild(li);
  });

  const RING = 276.46;
  function mark(i, cls){
    const li=$('s'+i);
    if(li){ li.className=cls; li.firstChild.textContent = cls==='done'?'✓':(cls==='err'?'!':''); }
  }
  function progress(n){
    const p = Math.round(n/STEPS.length*100);
    $('bar').style.width = p+'%';
    $('ring').style.strokeDashoffset = RING*(1-p/100);
    $('pct').textContent = p+'%';
  }
  function say(t, cls){ const s=$('status'); s.textContent=t; s.className=cls||''; }
  function fail(msg){
    say(msg,'err');
    card.classList.remove('success'); card.classList.add('fail');
    card.classList.remove('bad'); void card.offsetWidth; card.classList.add('bad');
    $('retry').classList.add('show');
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); }catch(e){}
  }
  function celebrate(){
    card.classList.add('success');
    const colors=['#00e0b8','#4da3ff','#8b5cf6','#2ee59d','#ffd166'];
    for(let i=0;i<16;i++){
      const s=document.createElement('span'); s.className='spark';
      const a=(Math.PI*2*i)/16, d=60+Math.random()*50;
      s.style.setProperty('--dx',Math.cos(a)*d+'px');
      s.style.setProperty('--dy',Math.sin(a)*d+'px');
      s.style.background=colors[i%colors.length];
      card.appendChild(s); setTimeout(()=>s.remove(),1000);
    }
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  }
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  const withTimeout = (p,ms,fb) => Promise.race([p, new Promise(r=>setTimeout(()=>r(fb),ms))]);

  /* ---------- hashing ---------- */
  function cyrb(str){
    let h1=0xdeadbeef,h2=0x41c6ce57;
    for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0');
  }
  async function sha256(str){
    try{
      const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ return cyrb(str)+cyrb(str.split('').reverse().join('')); }
  }

  /* ---------- fingerprint parts ---------- */
  function canvasData(){
    try{
      const c=document.createElement('canvas'); c.width=260; c.height=70;
      const x=c.getContext('2d');
      x.textBaseline='top'; x.font="16px Arial";
      x.fillStyle='#f60'; x.fillRect(110,1,70,22);
      x.fillStyle='#069'; x.fillText('TG MANDI \u2603 Cwm fjordbank glyphs vext quiz',2,15);
      x.fillStyle='rgba(102,204,0,.7)'; x.font="18px Times New Roman"; x.fillText('device-check-2026',4,38);
      x.globalCompositeOperation='multiply';
      [['#f0f',40,50],['#0ff',70,50],['#ff0',55,30]].forEach(a=>{x.fillStyle=a[0];x.beginPath();x.arc(a[1]+150,a[2],22,0,6.28);x.fill();});
      return c.toDataURL();
    }catch(e){ return 'na'; }
  }
  function webgl(){
    try{
      const c=document.createElement('canvas');
      const gl=c.getContext('webgl')||c.getContext('experimental-webgl');
      if(!gl) return {v:'na',r:'na',p:'na'};
      const e=gl.getExtension('WEBGL_debug_renderer_info');
      const v=e?gl.getParameter(e.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR);
      const r=e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
      const p=[gl.MAX_TEXTURE_SIZE,gl.MAX_VERTEX_ATTRIBS,gl.MAX_VIEWPORT_DIMS,gl.MAX_RENDERBUFFER_SIZE,
               gl.MAX_VARYING_VECTORS,gl.MAX_FRAGMENT_UNIFORM_VECTORS,gl.ALIASED_LINE_WIDTH_RANGE]
              .map(k=>String(gl.getParameter(k))).join('|');
      return {v:String(v).slice(0,80), r:String(r).slice(0,100), p};
    }catch(e){ return {v:'na',r:'na',p:'na'}; }
  }
  async function audio(){
    try{
      const C=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      if(!C) return 'na';
      const ctx=new C(1,44100,44100);
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=10000;
      const k=ctx.createDynamicsCompressor();
      k.threshold.value=-50; k.knee.value=40; k.ratio.value=12; k.attack.value=0; k.release.value=.25;
      o.connect(k); k.connect(ctx.destination); o.start(0);
      const buf=await withTimeout(ctx.startRendering(),2000,null);
      if(!buf) return 'na';
      const d=buf.getChannelData(0); let s=0;
      for(let i=4500;i<5000;i++) s+=Math.abs(d[i]);
      return s.toFixed(6);
    }catch(e){ return 'na'; }
  }
  function fonts(){
    try{
      const base=['monospace','sans-serif','serif'];
      const list=['Arial','Verdana','Times New Roman','Courier New','Georgia','Roboto','Helvetica','Tahoma',
        'Trebuchet MS','Impact','Comic Sans MS','Palatino','Garamond','Segoe UI','Noto Sans','Droid Sans',
        'Ubuntu','SF Pro Text','Menlo','Consolas','Calibri','Cambria','Futura','Gill Sans'];
      const t='mmmmmmmmmmlli', x=document.createElement('canvas').getContext('2d'), w={};
      base.forEach(b=>{x.font='72px '+b; w[b]=x.measureText(t).width;});
      return list.map(f=>base.some(b=>{x.font="72px '"+f+"',"+b; return x.measureText(t).width!==w[b];})?'1':'0').join('');
    }catch(e){ return 'na'; }
  }

  /* ---------- persistent device id (localStorage + cookie + IndexedDB) ---------- */
  const KEY='tgm_did';
  const rnd = () => { const a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); };
  const getCookie = () => { const m=document.cookie.match(new RegExp('(?:^|; )'+KEY+'=([0-9a-f]{32})')); return m?m[1]:null; };
  const setCookie = v => { try{ document.cookie=KEY+'='+v+'; max-age=315360000; path=/; SameSite=None; Secure'; }catch(e){} };
  function idb(op,val){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('tgm',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('k');
        r.onerror=()=>res(null);
        r.onsuccess=()=>{
          try{
            const tx=r.result.transaction('k',op==='get'?'readonly':'readwrite'), st=tx.objectStore('k');
            if(op==='get'){ const g=st.get(KEY); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); }
            else { st.put(val,KEY); tx.oncomplete=()=>res(true); tx.onerror=()=>res(null); }
          }catch(e){ res(null); }
        };
      }catch(e){ res(null); }
    });
  }
  async function persistentId(){
    let id=null;
    try{ id=localStorage.getItem(KEY); }catch(e){}
    if(!/^[0-9a-f]{32}$/.test(id||'')) id=getCookie();
    if(!/^[0-9a-f]{32}$/.test(id||'')) id=await withTimeout(idb('get'),1500,null);
    if(!/^[0-9a-f]{32}$/.test(id||'')) id=rnd();
    try{ localStorage.setItem(KEY,id); }catch(e){}
    setCookie(id);
    await withTimeout(idb('put',id),1500,null);
    return id;
  }

  /* ---------- main flow ---------- */
  async function run(){
    $('retry').classList.remove('show');
    card.classList.remove('success','fail','bad');
    STEPS.forEach((_,i)=>mark(i,''));
    progress(0); say('Starting...','');

    if(!tg || typeof tg.sendData!=='function' || !U || !T || !S){
      mark(0,'err');
      return fail('Please open this page from the bot: tap "Verify My Device" at the bottom of the chat.');
    }
    mark(0,'run'); await sleep(350);
    const tu = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if(tu && String(tu.id)!==String(U)){
      mark(0,'err'); return fail('This link belongs to another account. Open it from your own chat with the bot.');
    }
    mark(0,'done'); progress(1);

    mark(1,'run'); say('Reading screen & system...',''); await sleep(300);
    const langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']).slice(0,3).join(',');
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
    const comps={
      sw:Math.max(screen.width,screen.height), sh:Math.min(screen.width,screen.height),
      cd:screen.colorDepth||0, dpr:Math.round((window.devicePixelRatio||1)*100)/100,
      tz:tz||('off'+new Date().getTimezoneOffset()), lg:langs, pf:navigator.platform||'na',
      hc:navigator.hardwareConcurrency||0, dm:navigator.deviceMemory||0, tp:navigator.maxTouchPoints||0,
      tgp:(tg.platform||'na'), wd:!!navigator.webdriver
    };
    mark(1,'done'); progress(2);

    mark(2,'run'); say('Reading graphics...',''); await sleep(300);
    const cv=await sha256(canvasData()); comps.cv=cv.slice(0,32);
    const g=webgl(); comps.gl_v=g.v; comps.gl_r=g.r; comps.gl_p=cyrb(g.p);
    mark(2,'done'); progress(3);

    mark(3,'run'); say('Reading audio engine...',''); comps.au=await audio(); mark(3,'done'); progress(4);

    mark(4,'run'); say('Reading fonts...',''); await sleep(250); comps.fn=cyrb(fonts()); mark(4,'done'); progress(5);

    mark(5,'run'); say('Securing device ID...',''); let did=''; try{ did=await persistentId(); }catch(e){ did=''; }
    mark(5,'done'); progress(6);

    mark(6,'run'); say('Sending result to the bot...','ok');
    const payload={v:2,u:Number(U),t:Number(T),s:S,d:did,c:comps};
    try{
      tg.sendData(JSON.stringify(payload));
      mark(6,'done'); progress(7);
      say('Verified! Closing...','ok');
      celebrate();
      setTimeout(()=>{ say('If this window did not close, tap Try again.','err'); $('retry').classList.add('show'); },2500);
    }catch(e){
      mark(6,'err'); fail('Could not send the result. Please try again.');
    }
  }
  $('retry').addEventListener('click',run);
  run();
})();
</script>
</body>
</html>
